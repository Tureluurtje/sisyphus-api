<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Excel to JSON Converter</title><style>:root{--bg:#f5f7fb;--card:#ffffff;--text:#1f2937;--muted:#6b7280;--accent:#0f766e;--border:#d1d5db}html,body{box-sizing:border-box;height:100%;margin:0;padding:0;overflow:hidden}*,*::before,*::after{box-sizing:inherit}body{min-height:100vh;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#eef2ff 0%,var(--bg) 45%,#ecfeff 100%);color:var(--text);overflow-y:auto}.wrap{max-width:900px;margin:40px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 8px 30px rgb(15 23 42 / .08);overflow:hidden;max-width:100%}h1{margin:0 0 8px;font-size:1.6rem}p{margin:0 0 16px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}label{font-size:.9rem;display:block;margin-bottom:6px}input,button,textarea{width:100%;max-width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit}button{cursor:pointer;background:var(--accent);color:#fff;border:none;margin-top:6px}button:disabled{cursor:not-allowed;opacity:.6}textarea{min-height:260px;resize:vertical;margin-top:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}.status{margin-top:10px;font-size:.9rem}.ok{color:#166534}.error{color:#b91c1c} </style></head><body><main class="wrap"><section class="card"><h1>Excel to JSON Converter</h1><p> Pick an <code>.xlsx</code> file, then click convert. This version runs directly in the browser. </p><div class="grid"><div><label for="xlsxFile">Excel file (.xlsx)</label><input id="xlsxFile" type="file" accept=".xlsx" /></div><div><label for="classYear">Class year</label><input id="classYear" type="number" min="1" max="6" placeholder="1-6" /></div><div><label for="sheetName">Sheet name (optional)</label><input id="sheetName" type="text" placeholder="Sheet1" /></div></div><button id="convertBtn" type="button">Convert to JSON</button><button id="downloadBtn" type="button" disabled>Download JSON</button><div id="status" class="status"></div><textarea id="output" readonly placeholder="Converted JSON will appear here..."></textarea></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>class Word{constructor(e,t,n,r,a){this.wordId=e,this.chapterId=t,this.word=n,this.translation=r,this.targetDate=a}}class Chapter{constructor(e,t,n){this.chapterId=e,this.name=t,this.words=n}}let chapters=[],currentChapter=null,lastDate=null,latestJson="",latestBaseName="converted";function showStatus(e,t){const n=document.getElementById("status");n.textContent=e,n.className="status "+(t?"error":"ok")}function getCurrentChapter(){if(!chapters.length)throw new Error("No chapter has been added yet.");return chapters[chapters.length-1]}function toDate(e,t){if(null==e||""===e)return null;if(e instanceof Date)return e;if("number"==typeof e){const t=XLSX.SSF.parse_date_code(e);return t?new Date(t.y,t.m-1,t.d,t.H||0,t.M||0,t.S||0):null}if("string"==typeof e){let n=e.trim();if(n.startsWith("=")||/^[A-Za-z]+\d+(\s*[+\-]\s*\d+)?$/.test(n))return null;const r=n.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);if(r){const e=parseInt(r[1],10),n=parseInt(r[2],10)-1,a=r[3]?parseInt(r[3],10):null;let s;return s=null!=a?a<100?2e3+a:a:t instanceof Date?t.getFullYear():(new Date).getFullYear(),new Date(s,n,e)}const a=new Date(n);if(!Number.isNaN(a.getTime()))return a}return null}function replaceYearSafe(e,t){const n=e.getMonth(),r=e.getDate();let a=new Date(t,n,r,e.getHours(),e.getMinutes(),e.getSeconds(),e.getMilliseconds());return a.getMonth()!==n&&(a=new Date(t,n,28,e.getHours(),e.getMinutes(),e.getSeconds(),e.getMilliseconds())),a}function adjustYearRollover(e,t){if(!e)return null;if(!t)return e;if(e>t)return e;if(e.getTime()===t.getTime())return e;let n=t.getFullYear(),r=replaceYearSafe(e,n);for(;r<t;)n+=1,r=replaceYearSafe(e,n);return r}function generateChapter(e){const t=new Chapter(crypto.randomUUID(),e,[]);chapters.push(t),currentChapter=t}function generateWord(e,t,n,r){const a=getCurrentChapter(),s=new Word(crypto.randomUUID(),a.chapterId,t,n,r?r.toISOString():null);a.words.push(s)}function isEmptyRow(e){return e.every(e=>null==e||""===e)}function parseRow(e){if(!isEmptyRow(e))if("string"!=typeof e[1]||""===e[1].trim()){if(e[4]){const t=toDate(e[4],lastDate);t&&(lastDate=adjustYearRollover(t,lastDate))}generateWord(e[1],e[2],e[3],lastDate)}else generateChapter(e[1])}function computeSchoolYear(e){const t=[];for(const n of e)for(const e of n.words)if(e.targetDate){const n=new Date(e.targetDate).getFullYear();Number.isNaN(n)||t.push(n)}if(!t.length){const e=(new Date).getFullYear();return String(e%100).padStart(2,"0")+"-"+String((e+1)%100).padStart(2,"0")}const n=Math.min(...t),r=Math.max(...t);return r>n?String(n%100).padStart(2,"0")+"-"+String(r%100).padStart(2,"0"):String(n%100).padStart(2,"0")+"-"+String((n+1)%100).padStart(2,"0")}function convertToJson(e,t){const n=computeSchoolYear(t);return JSON.stringify({listId:crypto.randomUUID(),year:n,class:e,chapters:t},null,2)}function getSheet(e,t){return t&&e.SheetNames.includes(t)?e.Sheets[t]:e.SheetNames.includes("Sheet1")?e.Sheets.Sheet1:e.Sheets[e.SheetNames[0]]}async function convertFile(){try{showStatus("",!1);const e=document.getElementById("xlsxFile"),t=document.getElementById("classYear"),n=document.getElementById("sheetName"),r=document.getElementById("output"),a=document.getElementById("downloadBtn"),s=e.files[0];if(!s)throw new Error("Choose an .xlsx file first.");if(!s.name.toLowerCase().endsWith(".xlsx"))throw new Error("File is not correct Excel type (.xlsx).");const o=t.value;if(!o)throw new Error("Enter class year (1-6).");const l=await s.arrayBuffer(),c=XLSX.read(l,{type:"array",cellDates:!0}),u=getSheet(c,n.value.trim()),i=XLSX.utils.sheet_to_json(u,{header:1,raw:!0,defval:null});chapters=[],currentChapter=null,lastDate=null;for(const e of i.slice(1))parseRow(e);latestJson=convertToJson(o,chapters),latestBaseName=s.name.replace(/\.xlsx$/i,"")||"converted",r.value=latestJson,a.disabled=!1,showStatus("Converted successfully.",!1)}catch(e){document.getElementById("downloadBtn").disabled=!0,showStatus(e.message||String(e),!0)}}function downloadJson(){if(!latestJson)return;const e=new Blob([latestJson],{type:"application/json"}),t=URL.createObjectURL(e),n=document.createElement("a");n.href=t,n.download=latestBaseName+".json",document.body.appendChild(n),n.click(),n.remove(),URL.revokeObjectURL(t)}document.getElementById("convertBtn").addEventListener("click",convertFile),document.getElementById("downloadBtn").addEventListener("click",downloadJson); </script></body></html>
