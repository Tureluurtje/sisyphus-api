name: CI

on:
    push:
        branches:
            - develop
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            GOOGLE_OAUTH_REDIRECT_URL: "https://localhost/oauth/google/callback"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.14"

            - name: Install dependencies
              run: |
                python -m pip install --only-binary :all: --require-hashes --upgrade pip
                pip install --only-binary :all: --require-hashes -r requirements.txt

            - name: Run tests
              run: pytest
