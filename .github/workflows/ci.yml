name: CI

on:
    push:
        branches:
            - develop
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.14"

            - name: Install dependencies
              run: |
                python -m pip install --only-binary :all: --require-hashes --upgrade pip
                pip install --only-binary :all: --require-hashes -r requirements.txt
                pytest_download_dir="$(mktemp -d)"
                python -m pip download --only-binary :all: --no-deps --dest "$pytest_download_dir" pytest
                pytest_wheel="$(find "$pytest_download_dir" -name 'pytest-*.whl' -print -quit)"
                pytest_hash="$(python -m pip hash "$pytest_wheel" | sed -n 's/^--hash=sha256://p')"
                printf 'pytest==%s --hash=sha256:%s\n' "$(python -m pip show pytest 2>/dev/null | sed -n 's/^Version: //p')" "$pytest_hash" > "$pytest_download_dir/requirements.txt"
                pip install --only-binary :all: --require-hashes -r "$pytest_download_dir/requirements.txt"

            - name: Run tests
              run: pytest
