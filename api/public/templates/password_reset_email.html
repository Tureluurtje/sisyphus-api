<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset your password</title>
    </head>
    <body style="margin: 0; padding: 0; background-color: #f4f6f8; color: #17202a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f4f6f8;">
            <tr>
                <td align="center" style="padding: 40px 16px;">
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px; background-color: #ffffff; border: 1px solid #e1e6eb;">
                        <tr>
                            <td style="padding: 32px 36px 24px; border-bottom: 4px solid #2563eb;">
                                <p style="margin: 0; color: #2563eb; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;">Sisyphus</p>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 36px;">
                                <h1 style="margin: 0 0 16px; color: #17202a; font-size: 28px; line-height: 1.2;">Reset your password</h1>
                                <p style="margin: 0 0 24px; color: #4b5863; font-size: 16px; line-height: 1.6;">To reset your password, click the button below.</p>
                                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                    <tr>
                                        <td style="background-color: #2563eb;">
                                            <a href="{{ password_reset_url }}" style="display: inline-block; padding: 14px 24px; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none;">Reset Password</a>
                                        </td>
                                    </tr>
                                </table>
                                <p style="margin: 28px 0 8px; color: #687580; font-size: 13px; line-height: 1.5;">If the button does not work, copy and paste this link into your browser:</p>
                                <p style="margin: 0; overflow-wrap: anywhere; color: #2563eb; font-size: 13px; line-height: 1.5;"><a href="{{ password_reset_url }}" style="color: #2563eb;">{{ password_reset_url }}</a></p>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 20px 36px; background-color: #f8fafb; border-top: 1px solid #e1e6eb;">
                                <p style="margin: 0; color: #7a8791; font-size: 12px; line-height: 1.5;">If you did not request this email, you can safely ignore this email.</p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
