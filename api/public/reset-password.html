<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #eef3ff, #f9fbff);
        }

        main {
            width: min(100%, 440px);
            padding: 40px;
            background: #fff;
            border: 1px solid #e4e9f2;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgb(31 54 92 / 10%);
        }

        .brand {
            height: 44px;
            display: grid;
            place-items: center;
            margin-bottom: 24px;
            color: #315efb;
            font-weight: 700;
            font-size: 2rem;
            border-radius: 12px;
        }

        .seperator {
            height: 1px;
            margin: 1rem 0;
            background: #e4e9f2;
        }

        h1 { margin: 0 0 10px; font-size: 28px; }
        p { margin: 0 0 28px; color: #657089; line-height: 1.5; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        .password-field { position: relative; }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cfd7e6;
            border-radius: 9px;
            font: inherit;
        }
        .password-field input { padding-right: 48px; }
        input:focus { outline: 3px solid #315efb33; border-color: #315efb; }
        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            width: 32px;
            height: 32px;
            margin: 0;
            padding: 6px;
            display: grid;
            place-items: center;
            border: 0;
            color: #657089;
            background: transparent;
            transform: translateY(-50%);
        }
        .toggle-password:hover { color: #315efb; background: transparent; }
        .toggle-password svg { width: 20px; height: 20px; }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px 16px;
            border: 0;
            border-radius: 9px;
            color: #fff;
            font: inherit;
            font-weight: 600;
            background: #315efb;
            cursor: pointer;
        }
        button:hover { background: #244bd2; }
        .back { display: block; margin-top: 20px; color: #315efb; text-align: center; text-decoration: none; font-size: 14px; }
        .back:hover { text-decoration: underline; }
        .status { margin-top: 16px; color: #657089; line-height: 1.5; text-align: center; }
        .status.error { color: #c0392b; }
        .status.success { color: #218838; }
        .success-screen { text-align: center; }
        .success-screen[hidden] { display: none; }
        .success-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #218838;
            background: #eaf7ed;
            font-size: 28px;
        }
        .success-screen p { margin-bottom: 0; }
    </style>
</head>
    <body>
    <main>
        <div class="brand" aria-hidden="true">Sisyphus</div>
        <div class="seperator"></div>
        <div id="header">
            <h1>Reset your password</h1>
            <p>Choose a new password for your account.</p>
        </div>
        <form action="/reset-password" method="post">
            <label for="password">New password</label>
            <div class="password-field">
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                <button class="toggle-password" type="button" aria-label="Show new password" aria-pressed="false" data-target="password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="2.5"></circle>
                    </svg>
                </button>
            </div>
            <label for="password-confirm" style="margin-top: 20px;">Confirm new password</label>
            <div class="password-field">
                <input id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" required>
                <button class="toggle-password" type="button" aria-label="Show password confirmation" aria-pressed="false" data-target="password-confirm">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="2.5"></circle>
                    </svg>
                </button>
            </div>
            <button type="submit">Reset password</button>
        </form>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <section class="success-screen" hidden aria-live="polite">
            <div class="success-icon" aria-hidden="true">&#10003;</div>
            <h1>Password reset successful</h1>
            <p>Your password has been updated. You can now sign in with your new password.</p>
        </section>
    </main>
    <script>
        const form = document.querySelector('form');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('password-confirm');
        const header = document.getElementById('header');
        const status = document.getElementById('status');
        const seperator = document.querySelector('.seperator');
        const successScreen = document.querySelector('.success-screen');

        document.querySelectorAll('.toggle-password').forEach((toggle) => {
            toggle.addEventListener('click', () => {
                const input = document.getElementById(toggle.dataset.target);
                const isVisible = input.type === 'text';
                input.type = isVisible ? 'password' : 'text';
                toggle.setAttribute('aria-pressed', String(!isVisible));
                toggle.setAttribute('aria-label', `${isVisible ? 'Show' : 'Hide'} ${toggle.dataset.target === 'password' ? 'new password' : 'password confirmation'}`);
            });
        });

        const showStatus = (message, type = 'error') => {
            status.textContent = message;
            status.className = `status ${type}`;
        };

        form.addEventListener('submit', (event) => {
            if (passwordInput.value !== passwordConfirmInput.value) {
                event.preventDefault();
                showStatus('Passwords do not match. Please try again.');
                return;
            }

            event.preventDefault();

            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) {
                showStatus('Invalid or missing reset token.');
                return;
            }

            fetch(`/api/auth/reset-forgotten-password?token=${encodeURIComponent(token)}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_password: passwordInput.value })
            })
                .then(async (response) => {
                    if (!response.ok) {
                        const body = await response.json().catch(() => ({}));
                        const error = new Error(body.error || 'Unable to reset password.');
                        error.status = response.status;
                        throw error;
                    }

                    form.hidden = true;
                    status.hidden = true;
                    header.hidden = true;
                    successScreen.hidden = false;
                    sepearator.hidden = true;
                    form.reset();
                })
                .catch((error) => {
                    showStatus(error.message || 'Unable to reset password. Please try again.');
                });
        });


    </script>
</body>
</html>
